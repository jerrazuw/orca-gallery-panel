name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != package.json v$version"; exit 1; }

      - run: npm test

      - name: Check the demo plugin in plugin/ is this version
        run: |
          version="$(node -p "require('./plugin/orca-plugin.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "plugin/ is v$version; run npm run build:demo"; exit 1; }

      - name: Zip the demo plugin
        run: cp -R plugin gallery-panel-demo && zip -r gallery-panel-demo.zip gallery-panel-demo

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gallery-panel-demo.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
