<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery</title>
    <style>
      :root {
  --gallery-bg: var(--background, #0a0a0a);
  --gallery-fg: var(--foreground, #fafafa);
  --gallery-muted: var(--muted-foreground, #a1a1a1);
  --gallery-surface: var(--secondary, #262626);
  --gallery-border: var(--border, rgb(255 255 255 / 0.1));
  --gallery-ring: var(--ring, #a1a1a1);
  --gallery-input: var(--input, rgb(255 255 255 / 0.15));
  --gallery-primary: var(--primary, #e5e5e5);
  --gallery-primary-fg: var(--primary-foreground, #171717);
  --gallery-danger: var(--destructive, #f87171);
  --gallery-radius: var(--radius, 0.625rem);
  --gallery-fade: 600ms;
  --gallery-kenburns: 30s;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--gallery-bg);
  color: var(--gallery-fg);
  font:
    12px/1.4 system-ui,
    sans-serif;
}

/* Stage and images */

.stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--gallery-fade) ease;
}

.layer.visible {
  opacity: 1;
  pointer-events: auto;
}

.photo,
.backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.photo {
  object-fit: contain;
  cursor: pointer;
}

body[data-fit='cover'] .photo {
  object-fit: cover;
}

body.single .photo {
  cursor: default;
}

.backdrop {
  display: none;
  object-fit: cover;
  filter: blur(28px) brightness(0.7);
  transform: scale(1.15);
}

body.blur[data-fit='contain'] .backdrop {
  display: block;
}

body.kenburns .layer.animate .photo {
  animation: kenburns var(--gallery-kenburns) ease-in-out both;
}

body.kenburns .layer.animate.alternate .photo {
  animation-direction: reverse;
}

body.paused .photo {
  animation-play-state: paused !important;
}

@keyframes kenburns {
  from {
    transform: scale(1) translate(0, 0);
  }

  to {
    transform: scale(1.12) translate(-2%, -1.5%);
  }
}

.caption {
  display: none;
  position: absolute;
  inset: 0 0 auto;
  margin: 0;
  padding: 10px 12px 24px;
  overflow: hidden;
  color: #fff;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgb(0 0 0 / 0.6);
  background: linear-gradient(rgb(0 0 0 / 0.55), transparent);
  pointer-events: none;
}

body.show-caption .caption:not(:empty) {
  display: block;
}

.message-text {
  display: none;
  position: absolute;
  inset: 0;
  margin: 0;
  padding: 24px;
  place-content: center;
  text-align: center;
  color: var(--gallery-muted);
}

body.message .message-text {
  display: grid;
}

body.message .controls,
body.message .layer,
body.message .caption {
  display: none;
}

/* Toolbar */

.controls {
  position: absolute;
  left: 50%;
  bottom: 12px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  transform: translateX(-50%);
  border: 1px solid var(--gallery-border);
  border-radius: var(--gallery-radius);
  background: color-mix(in srgb, var(--gallery-surface) 85%, transparent);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity 200ms ease;
}

body:hover .controls,
.controls:focus-within,
body.editing .controls,
body.paused .controls {
  opacity: 1;
}

.control {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: calc(var(--gallery-radius) - 4px);
  background: transparent;
  color: var(--gallery-fg);
  cursor: pointer;
}

.control:hover {
  background: color-mix(in srgb, var(--gallery-fg) 12%, transparent);
}

.control[aria-expanded='true'] {
  background: color-mix(in srgb, var(--gallery-fg) 16%, transparent);
}

.control svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-play {
  fill: currentColor;
}

.icon-play,
body.paused .icon-pause,
.icon-fit,
body[data-fit='cover'] .icon-fill {
  display: none;
}

body.paused .icon-play,
body[data-fit='cover'] .icon-fit {
  display: block;
}

.counter {
  min-width: 44px;
  padding: 0 6px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  color: var(--gallery-muted);
}

body.single [data-action='previous'],
body.single [data-action='next'],
body.single [data-action='toggle'],
body.single [data-action='interval'],
body.single .counter {
  display: none;
}

@media (max-width: 280px) {
  .counter {
    display: none;
  }
}

/* Popovers: interval editor and settings */

.popover {
  position: absolute;
  right: 0;
  bottom: calc(100% + 8px);
  width: 210px;
  padding: 10px;
  border: 1px solid var(--gallery-border);
  border-radius: var(--gallery-radius);
  background: var(--gallery-surface);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
}

.popover[hidden] {
  display: none;
}

.popover-title {
  display: block;
  margin: 0 0 6px;
  font-weight: 600;
}

.interval-row {
  display: flex;
  gap: 6px;
}

.interval-row input {
  flex: 1;
  min-width: 0;
  padding: 4px 8px;
  border: 1px solid var(--gallery-input);
  border-radius: calc(var(--gallery-radius) - 4px);
  background: var(--gallery-bg);
  color: var(--gallery-fg);
  font: inherit;
  font-variant-numeric: tabular-nums;
}

.interval-row input[aria-invalid='true'] {
  border-color: var(--gallery-danger);
}

.apply {
  padding: 4px 10px;
  border: 0;
  border-radius: calc(var(--gallery-radius) - 4px);
  background: var(--gallery-primary);
  color: var(--gallery-primary-fg);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 0;
  cursor: pointer;
}

.switch input {
  appearance: none;
  position: relative;
  flex: none;
  order: 1;
  width: 28px;
  height: 16px;
  margin: 0;
  border-radius: 999px;
  background: var(--gallery-input);
  cursor: pointer;
  transition: background 150ms ease;
}

.switch input::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gallery-fg);
  transition: transform 150ms ease;
}

.switch input:checked {
  background: var(--gallery-primary);
}

.switch input:checked::after {
  background: var(--gallery-primary-fg);
  transform: translateX(12px);
}

.hint {
  margin: 6px 0 0;
  color: var(--gallery-muted);
}

.hint.error {
  color: var(--gallery-danger);
}

/* Note in the sample build listed in Orca's plugin directory */

.demo-note {
  position: absolute;
  inset: 12px 12px auto;
  max-height: calc(100% - 80px);
  overflow-y: auto;
  padding: 10px 32px 10px 12px;
  border: 1px solid var(--gallery-border);
  border-radius: var(--gallery-radius);
  background: color-mix(in srgb, var(--gallery-surface) 92%, transparent);
  backdrop-filter: blur(6px);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
}

.demo-note[hidden] {
  display: none;
}

.demo-note p {
  margin: 0 0 6px;
}

.demo-note p:last-of-type {
  margin-bottom: 0;
  color: var(--gallery-muted);
}

.demo-title {
  font-weight: 600;
}

.demo-command {
  display: block;
  margin: 0 0 6px;
  padding: 6px 8px;
  border-radius: calc(var(--gallery-radius) - 4px);
  background: var(--gallery-bg);
  font:
    11px/1.4 ui-monospace,
    monospace;
  overflow-wrap: break-word;
  user-select: all;
}

.demo-dismiss {
  position: absolute;
  top: 6px;
  right: 6px;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: calc(var(--gallery-radius) - 4px);
  background: transparent;
  color: var(--gallery-muted);
  cursor: pointer;
}

.demo-dismiss:hover {
  background: color-mix(in srgb, var(--gallery-fg) 10%, transparent);
  color: var(--gallery-fg);
}

.demo-dismiss svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
}

body.message .demo-note {
  display: none;
}

/* Focus and motion */

.control:focus-visible,
.demo-dismiss:focus-visible,
.apply:focus-visible,
.interval-row input:focus-visible,
.switch input:focus-visible {
  outline: 2px solid var(--gallery-ring);
  outline-offset: 1px;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --gallery-fade: 0ms;
  }

  .controls,
  .switch input,
  .switch input::after {
    transition: none;
  }

  body.kenburns .layer.animate .photo {
    animation: none;
  }
}

    </style>
  </head>
  <body>
    <main class="stage">
      <div id="layer-a" class="layer">
        <img class="backdrop" alt="" aria-hidden="true" />
        <img class="photo" alt="" />
      </div>
      <div id="layer-b" class="layer">
        <img class="backdrop" alt="" aria-hidden="true" />
        <img class="photo" alt="" />
      </div>
      <p id="caption" class="caption"></p>
      <p id="message" class="message-text" role="status"></p>
    </main>

    <aside id="demo-note" class="demo-note" aria-labelledby="demo-title" hidden>
      <p id="demo-title" class="demo-title"></p>
      <p id="demo-run"></p>
      <code class="demo-command"
        >npx orca-gallery-panel ~/Pictures --out ~/orca-gallery --watch</code
      >
      <p id="demo-add"></p>
      <p id="demo-watch"></p>
      <button type="button" id="demo-dismiss" class="demo-dismiss">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </aside>

    <div class="controls" role="toolbar">
      <button type="button" class="control" data-action="previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <button type="button" class="control" data-action="toggle" aria-pressed="false">
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5v14M15 5v14" />
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4.5v15l12-7.5z" />
        </svg>
      </button>
      <button type="button" class="control" data-action="next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>
      <span id="counter" class="counter" role="status"></span>
      <button
        type="button"
        class="control"
        data-action="interval"
        aria-expanded="false"
        aria-controls="interval-editor"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
      </button>
      <button
        type="button"
        class="control"
        data-action="settings"
        aria-expanded="false"
        aria-controls="settings-panel"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" />
          <circle cx="15" cy="6" r="2" />
          <circle cx="9" cy="12" r="2" />
          <circle cx="17" cy="18" r="2" />
        </svg>
      </button>
      <button type="button" class="control" data-action="fit">
        <svg class="icon-fill" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
        </svg>
        <svg class="icon-fit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" />
        </svg>
      </button>
      <div id="interval-editor" class="popover" hidden>
        <label id="interval-label" class="popover-title" for="interval-input"></label>
        <div class="interval-row">
          <input
            id="interval-input"
            type="number"
            inputmode="numeric"
            min="0"
            max="86400"
            step="1"
            aria-describedby="interval-hint"
          />
          <button type="button" id="interval-apply" class="apply"></button>
        </div>
        <p id="interval-hint" class="hint"></p>
      </div>
      <div id="settings-panel" class="popover" role="group" aria-labelledby="settings-title" hidden>
        <p id="settings-title" class="popover-title"></p>
        <label class="switch">
          <input type="checkbox" role="switch" data-setting="blur" />
          <span></span>
        </label>
        <label class="switch">
          <input type="checkbox" role="switch" data-setting="kenburns" />
          <span></span>
        </label>
        <label class="switch">
          <input type="checkbox" role="switch" data-setting="caption" />
          <span></span>
        </label>
        <p id="settings-note" class="hint"></p>
      </div>
    </div>
